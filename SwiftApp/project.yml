# XcodeGen spec for the Mac + iPad app (needs full Xcode).
#   brew install xcodegen
#   cd SwiftApp && xcodegen generate && open ChurchTranslate.xcodeproj
name: ChurchTranslate
options:
  bundleIdPrefix: org.churchai
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "3.0.1"
    CURRENT_PROJECT_VERSION: "3.0.1"
targets:
  ChurchTranslate:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources/ChurchTranslate
      - path: Resources/Assets.xcassets
      # Swear-word filter list, shared with the Python app
      - path: ../word_filter.txt
        buildPhase: resources
      # Privacy manifest (App Store requires it: the app uses UserDefaults)
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Resources/Info-Xcode.plist
      properties:
        CFBundleDisplayName: Church Translate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # iPad: show saved transcripts in the Files app (On My iPad → Church Translate)
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSMicrophoneUsageDescription: Church Translate listens to the preacher's microphone so it can translate the sermon.
        NSAudioCaptureUsageDescription: Church Translate can translate a video or livestream playing on this Mac when you choose "Mac's sound" as the input.
        NSSpeechRecognitionUsageDescription: Church Translate turns the preacher's speech into text on this device so it can be translated.
        UIBackgroundModes: [audio]
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.churchai.translate
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "2"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Resources/ChurchTranslate.entitlements
        CODE_SIGN_STYLE: Automatic
